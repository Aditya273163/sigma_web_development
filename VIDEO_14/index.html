<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS</title>
    <style>
        div,span {
            color: red;
            background-color: yellow; 
        }
    </style>
</head>
<body>
    <div>
        <h1>CSS</h1>
        <p>CSS is used to style HTML elements.</p>
        <p>lore ipsum dolor sit amet
            <span>consectetur adipiscing elit.</span>
        </p>
    </div>
</body>
</html>
